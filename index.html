<!doctype html>
<html lang="ru" data-theme="light">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="color-scheme" content="light dark" />
		<title>Мои задачи</title>
		<link
			rel="icon"
			href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f6cbd'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
		/>
		<script>
			// Apply the saved theme before first paint to avoid a flash
			try {
				var t = localStorage.getItem('theme');
				if (!t && matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
				if (t) document.documentElement.setAttribute('data-theme', t);
			} catch (e) {}
		</script>
		<link rel="stylesheet" href="dist/css/main.css" />
	</head>
	<body>
		<div class="page">
			<header class="page__header">
				<div class="page__heading">
					<h1 class="page__title">Мои задачи</h1>
					<p class="page__subtitle js-today"></p>
				</div>
				<button
					type="button"
					class="js-theme-toggle theme-toggle"
					aria-label="Тёмная тема"
					aria-pressed="false"
				>
					<svg class="icon theme-toggle__icon theme-toggle__icon--moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
						<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" />
					</svg>
					<svg class="icon theme-toggle__icon theme-toggle__icon--sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
						<circle cx="12" cy="12" r="4" />
						<path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4" />
					</svg>
				</button>
			</header>

			<main class="page__main">
				<div class="controls">
					<div class="search">
						<label for="task-search" class="visually-hidden">Поиск задач</label>
						<svg class="icon search__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
							<circle cx="11" cy="11" r="6" />
							<path d="M20 20l-4.2-4.2" />
						</svg>
						<input
							type="search"
							id="task-search"
							class="js-search search__input"
							placeholder="Найти задачу"
						/>
					</div>
					<button
						type="button"
						class="js-add-task btn btn--primary btn--block-mobile"
						id="btn-open-modal"
					>
						<svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
							<path d="M12 5v14M5 12h14" />
						</svg>
						Добавить задачу
					</button>
				</div>

				<section class="tasks-section">
					<div class="tasks-section__head">
						<h2 id="list-heading">Список задач</h2>
						<span class="tasks-section__count js-task-count"></span>
					</div>
					<ul class="task-list js-task-list" aria-labelledby="list-heading">
						<!-- Задачи будут добавляться сюда динамически -->
					</ul>
					<div class="empty-state js-empty" hidden>
						<svg class="empty-state__art" viewBox="0 0 112 88" fill="none" aria-hidden="true" focusable="false">
							<rect x="14" y="8" width="84" height="72" rx="8" fill="currentColor" opacity="0.1" />
							<rect x="14" y="8" width="84" height="72" rx="8" stroke="currentColor" stroke-width="2" />
							<circle cx="32" cy="30" r="7" stroke="currentColor" stroke-width="2" />
							<path d="M29 30l2.2 2.2L35.5 28" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
							<path d="M48 30h34" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
							<circle cx="32" cy="52" r="7" stroke="currentColor" stroke-width="2" />
							<path d="M48 52h24" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
						</svg>
						<h3 class="empty-state__title js-empty-title"></h3>
						<p class="empty-state__text js-empty-text"></p>
					</div>
				</section>
			</main>

			<!-- Модальное окно создания/редактирования задачи -->
			<dialog class="modal js-task-dialog" aria-labelledby="dialog-title">
				<form method="dialog" class="modal__form">
					<h2 id="dialog-title" class="modal__title">Новая задача</h2>

					<div class="form-group">
						<label for="task-title" class="form-group__label">Название задачи</label>
						<input
							type="text"
							id="task-title"
							class="form-group__input"
							name="title"
							required
							autofocus
							autocomplete="off"
							placeholder="Например, подготовить отчёт"
						/>
					</div>

					<div class="modal__actions">
						<button type="button" class="js-close-dialog btn btn--secondary">
							Отмена
						</button>
						<button type="submit" class="btn btn--primary">Сохранить</button>
					</div>
				</form>
			</dialog>
		</div>

		<script src="js/main.js"></script>
	</body>
</html>
