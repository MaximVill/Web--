<!doctype html>
<html lang="ru" data-theme="light">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="color-scheme" content="light dark" />
		<title>Мои задачи</title>
		<link
			rel="icon"
			href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f6cbd'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
		/>
		<script>
			// Apply the saved theme before first paint to avoid a flash
			try {
				var t = localStorage.getItem('theme');
				if (!t && matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
				if (t) document.documentElement.setAttribute('data-theme', t);
			} catch (e) {}
		</script>
	</head>
	<body>
		<div id="app"></div>
		<script type="module" src="/src/main.js"></script>
	</body>
</html>
