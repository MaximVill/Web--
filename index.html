<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Лабораторная №5 — Введение в Vue</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    body {
      font-family: sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
    }
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
    }
    button {
      padding: 10px 15px;
      border: none;
      background: #ddd;
      border-radius: 5px;
      cursor: pointer;
    }
    button.active {
      background: #42b883;
      color: white;
    }
    .task {
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    input, button {
      margin-top: 8px;
      padding: 6px;
    }
    ul {
      padding-left: 20px;
    }
  </style>
</head>
<body>
<div id="app">
  <h1>Лабораторная №5 — Введение в Vue</h1>

  <div class="tabs">
    <button
            v-for="(tab, i) in tabs"
            :key="i"
            :class="{ active: currentTab === i }"
            @click="currentTab = i"
    >
      Задание {{ i + 1 }}
    </button>
  </div>

  <div class="task">
    <component :is="tabs[currentTab]"></component>
  </div>
</div>

<script>
  const { createApp, ref, defineComponent} = Vue

  // --- ЗАДАНИЕ 1 ---
  const Task1 = defineComponent({
    data() {
      return {
        name: 'Максим'
      }
    },
    template: `
      <div>
        <h2>Задание 1. Привет, Vue!</h2>
        <p>Привет, {{ name || 'незнакомец' }}!</p>
        <input v-model="name" placeholder="Введите имя" />
      </div>
    `
  })

  // --- ЗАДАНИЕ 2 ---
  const Task2 = defineComponent({
    setup() {
      const count = ref(0)
      const increment = () => {
        count.value++
      }
      return { count, increment }
    },
    template: `
      <div>
        <h2>Задание 2. Реактивный счётчик</h2>
        <p>Счётчик: {{ count }}</p>
        <button @click="increment">+1</button>
      </div>
    `
  })

  // --- ЗАДАНИЕ 3 ---
  const Task3 = defineComponent({
    setup() {
      const isVisible = ref(false)
      const toggle = () => {
        isVisible.value = !isVisible.value
      }
      return { isVisible, toggle }
    },
    template: `
      <div>
        <h2>Задание 3. Условный рендеринг</h2>
        <button @click="toggle">{{ isVisible ? 'Скрыть' : 'Показать' }} описание</button>
        <p v-if="isVisible">
          Vue — прогрессивный JavaScript-фреймворк для создания пользовательских интерфейсов.
        </p>
        <p v-else><i>Описание скрыто</i></p>
      </div>
    `
  })

  // --- ЗАДАНИЕ 4 ---
  const Task4 = defineComponent({
    setup() {
      const tasks = ref([
        { id: 1, title: 'Установить Vue' },
        { id: 2, title: 'Разобраться с директивами' },
        { id: 3, title: 'Сделать лабораторную' },
        { id: 4, title: 'Сдать лабораторную' }
      ])
      return { tasks }
    },
    template: `
      <div>
        <h2>Задание 4. Список элементов</h2>
        <ul>
          <li v-for="(task, index) in tasks" :key="task.id">
            {{ index + 1 }}. {{ task.title }}
          </li>
        </ul>
      </div>
    `
  })

  createApp({
    setup() {
      const currentTab = ref(0)
      const tabs = [Task1, Task2, Task3, Task4]
      return { currentTab, tabs }
    }
  }).mount('#app')
</script>
</body>
</html>
